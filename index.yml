name: pages
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: git ls-files scenarios | jq -R . | jq -s . > index.json
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: d
        uses: actions/deploy-pages@v4
