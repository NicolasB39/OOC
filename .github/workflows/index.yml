name: pages
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # Tests unitaires puis de bout en bout dans Chromium, sur les fichiers tels qu'ils seront publiés.
  # Job à part : node_modules et le navigateur ne partent pas dans l'artefact du site.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-echec
          path: e2e-echec.png
          if-no-files-found: ignore
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build
      - run: git -c core.quotepath=off ls-files scenarios | jq -R . | jq -s . > index.json
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: d
        uses: actions/deploy-pages@v4
