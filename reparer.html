<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Réparer Histoires</title>
<style>
body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#0a0a0b;color:#f2f2ee;font:16px/1.6 system-ui,sans-serif;padding:24px}
main{max-width:460px}
h1{margin:0 0 12px;font-size:26px;letter-spacing:-.03em}
p{color:#b6b6bf}
button{margin-top:8px;width:100%;padding:16px;border:0;border-radius:16px;background:#d2f53c;color:#0a0a0b;font:700 17px system-ui,sans-serif;cursor:pointer}
#st{margin-top:14px;color:#d2f53c;min-height:1.6em}
</style>
</head>
<body>
<main>
<h1>Réparer l'application</h1>
<p>Si Histoires ne s'ouvre plus ou si les boutons ne répondent plus, cette page supprime les copies d'application gardées en cache sur cet appareil, puis rouvre l'application avec les derniers fichiers.</p>
<p><b>Vos histoires et vos réglages ne sont pas effacés.</b></p>
<button id="go">Réparer</button>
<div id="st" role="status"></div>
</main>
<script src="js/reparer.js"></script>
</body>
</html>
